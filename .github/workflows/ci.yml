name: Validate memory card support

on:
  push:
    branches: [main, mcd-card-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - run: dart pub get --enforce-lockfile
      - run: dart analyze lib test tool
      - run: dart test
      - run: dart run tool/build.dart
      - name: Verify committed Pages output is current
        run: git diff --exit-code -- docs/
